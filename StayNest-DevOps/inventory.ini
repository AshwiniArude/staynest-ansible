# StayNest - Ansible inventory
# ---------------------------------------------------------------------------
# ansible_host                 -> public IPv4 of the Ubuntu EC2 instance
# ansible_ssh_private_key_file -> copy of staynest-key.pem inside WSL
#   (copied from C:\Users\user\Downloads and chmod 400; SSH rejects the key
#    straight from /mnt/c because it appears world-readable there)
# ---------------------------------------------------------------------------

[webservers]
staynest-server ansible_host=3.108.215.108 ansible_user=ubuntu ansible_ssh_private_key_file=/home/uservdk/.ssh/staynest-key.pem
