[defaults]
# Default inventory (resolved relative to this ansible.cfg)
inventory = inventory.ini
remote_user = ubuntu

# Initial assignment setup only: do not prompt for / verify EC2 host keys
host_key_checking = False

timeout = 30
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30
pipelining = True
